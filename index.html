<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Meal Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f1ed 0%, #ede7e1 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fefdfb;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(139, 90, 43, 0.1);
            padding: 40px;
        }

        h1 {
            color: #6b4423;
            margin-bottom: 10px;
            text-align: center;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #a0744d;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }

        .section {
            background: #faf8f5;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #ede7e1;
        }

        .section h2 {
            color: #8b5a2b;
            font-size: 16px;
            margin-bottom: 18px;
            border-bottom: 2px solid #d4a574;
            padding-bottom: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd5cc;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            color: #333;
            transition: border 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #d4a574;
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.1);
        }

        input::placeholder {
            color: #bbb;
        }

        button {
            padding: 12px 24px;
            background: #c9956d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }

        button:hover {
            background: #b8844f;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 90, 43, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: #8b5a2b;
            padding: 8px 16px;
            font-size: 12px;
        }

        button.secondary:hover {
            background: #6b4423;
        }

        .ingredient-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tag {
            background: white;
            border: 1px solid #d4a574;
            color: #8b5a2b;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(139, 90, 43, 0.08);
        }

        .tag button {
            background: none;
            color: #d4a574;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            transition: color 0.3s;
        }

        .tag button:hover {
            color: #c9956d;
            transform: none;
            box-shadow: none;
        }

        .recipe-card {
            background: white;
            border: 1px solid #ede7e1;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .recipe-card:hover {
            box-shadow: 0 6px 16px rgba(139, 90, 43, 0.12);
            border-color: #d4a574;
            transform: translateY(-2px);
        }

        .recipe-card h3 {
            color: #6b4423;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: 600;
        }

        .recipe-card p {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .missing {
            color: #c75a4a;
            font-weight: 600;
            display: block;
            margin-top: 8px;
        }

        .have {
            color: #6b9a6b;
            font-weight: 600;
            display: block;
            margin-top: 8px;
        }

        .recipe-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .recipe-buttons button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            color: #c9956d;
            font-weight: 600;
            padding: 20px;
        }

        .error {
            background: #ffe8e0;
            color: #c75a4a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            border-left: 4px solid #c75a4a;
        }

        .success {
            background: #e8f5e0;
            color: #6b9a6b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            border-left: 4px solid #6b9a6b;
        }

        .grocery-list {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ede7e1;
        }

        .grocery-list ul {
            list-style: none;
        }

        .grocery-list li {
            padding: 10px;
            border-bottom: 1px solid #f5f1ed;
            font-size: 14px;
            color: #6b4423;
        }

        .grocery-list li:last-child {
            border-bottom: none;
        }

        .grocery-list li:before {
            content: "• ";
            color: #c9956d;
            font-weight: bold;
            margin-right: 8px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            background-color: #fefdfb;
            margin: 5% auto;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close-button {
            color: #bbb;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            transition: color 0.3s;
        }

        .close-button:hover {
            color: #c9956d;
            transform: none;
            box-shadow: none;
        }

        .modal-title {
            color: #6b4423;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
        }

        .modal-section {
            margin-bottom: 25px;
        }

        .modal-section h3 {
            color: #8b5a2b;
            font-size: 14px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-section p {
            color: #666;
            line-height: 1.6;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 30px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🍽️ Recipe Meal Planner</h1>
        <p class="subtitle">Organize your meals, manage your pantry</p>

        <div class="grid">
            <!-- Pantry Section -->
            <div class="section">
                <h2>Your Pantry</h2>
                <div class="input-group">
                    <input type="text" id="ingredientInput" placeholder="Add ingredient..."
                        onkeypress="handleIngredientKeypress(event)">
                    <button onclick="addIngredient()">Add</button>
                </div>
                <div id="pantryMessage"></div>
                <div class="ingredient-list" id="pantryList"></div>
            </div>

            <!-- Search Section -->
            <div class="section">
                <h2>Search Recipes</h2>
                <div class="input-group">
                    <input type="text" id="searchInput" placeholder="Search by ingredient..."
                        onkeypress="handleSearchKeypress(event)">
                    <button onclick="searchRecipes()">Search</button>
                </div>
                <div id="searchMessage"></div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="section">
            <h2>Search Results</h2>
            <div id="recipeResults"></div>
        </div>

        <!-- Favorites & Grocery List -->
        <div class="grid">
            <div class="section">
                <h2>Saved Recipes</h2>
                <div id="favoritesList"></div>
            </div>

            <div class="section">
                <h2>Grocery List</h2>
                <button onclick="buildGroceryList()" style="margin-bottom: 15px; width: 100%;">Generate Grocery
                    List</button>
                <div id="groceryList"></div>
            </div>
        </div>
    </div>

    <!-- Recipe Detail Modal -->
    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <button class="close-button" onclick="closeModal()">&times;</button>
            <h2 class="modal-title" id="modalRecipeName"></h2>

            <div class="modal-section">
                <h3>Ingredients</h3>
                <p id="modalIngredients"></p>
            </div>

            <div class="modal-section">
                <h3>Instructions</h3>
                <p id="modalInstructions"></p>
            </div>

            <div class="modal-section">
                <p id="modalMissingStatus"></p>
            </div>

            <div class="recipe-buttons">
                <button onclick="closeModal()">Close</button>
                <button class="secondary" id="saveRecipeBtn" onclick="saveFromModal()">Save Recipe</button>
            </div>
        </div>
    </div>

    <script>
        const THEMEALDB_URL = "https://www.themealdb.com/api/json/v1/1";
        let currentRecipeId = null;
        let currentRecipeName = null;

        // Load/Save from localStorage
        function getPantry() {
            return JSON.parse(localStorage.getItem("pantry") || '[]');
        }

        function savePantry(pantry) {
            localStorage.setItem("pantry", JSON.stringify(pantry));
            renderPantry();
        }

        function getFavorites() {
            return JSON.parse(localStorage.getItem("favorites") || '[]');
        }

        function saveFavorites(favorites) {
            localStorage.setItem("favorites", JSON.stringify(favorites));
            renderFavorites();
        }

        // Pantry functions
        function handleIngredientKeypress(event) {
            if (event.key === "Enter") {
                addIngredient();
            }
        }

        function handleSearchKeypress(event) {
            if (event.key === "Enter") {
                searchRecipes();
            }
        }

        function addIngredient() {
            const input = document.getElementById("ingredientInput");
            const ingredient = input.value.trim().toLowerCase();

            if (!ingredient) {
                showMessage("pantryMessage", "Please enter an ingredient", "error");
                return;
            }

            const pantry = getPantry();
            if (pantry.includes(ingredient)) {
                showMessage("pantryMessage", "Already in pantry", "error");
                return;
            }

            pantry.push(ingredient);
            savePantry(pantry);
            input.value = "";
            showMessage("pantryMessage", `✅ Added '${ingredient}'`, "success");
        }

        function removeIngredient(ingredient) {
            const pantry = getPantry();
            const updated = pantry.filter(i => i !== ingredient);
            savePantry(updated);
            showMessage("pantryMessage", `✅ Removed '${ingredient}'`, "success");
        }

        function renderPantry() {
            const pantry = getPantry();
            const list = document.getElementById("pantryList");

            if (pantry.length === 0) {
                list.innerHTML = '<div class="empty-state">Add ingredients to your pantry</div>';
                return;
            }

            list.innerHTML = pantry.map(ing => `
                <div class="tag">
                    ${ing}
                    <button onclick="removeIngredient('${ing}')">✕</button>
                </div>
            `).join("");
        }

        // Search functions
        async function searchRecipes() {
            const input = document.getElementById("searchInput").value.trim();
            if (!input) {
                showMessage("searchMessage", "Enter an ingredient to search", "error");
                return;
            }

            const resultsDiv = document.getElementById("recipeResults");
            resultsDiv.innerHTML = '<div class="loading">Searching...</div>';

            try {
                const response = await fetch(`${THEMEALDB_URL}/filter.php?i=${input}`);
                const data = await response.json();
                const recipes = data.meals || [];

                if (recipes.length === 0) {
                    resultsDiv.innerHTML = '<div class="empty-state">No recipes found</div>';
                    return;
                }

                resultsDiv.innerHTML = recipes.slice(0, 8).map(recipe => `
                    <div class="recipe-card" onclick="viewRecipe('${recipe.idMeal}', '${recipe.strMeal.replace(/'/g, "\\'")}')">
                        <h3>${recipe.strMeal}</h3>
                        <p style="cursor: pointer; color: #c9956d;">Click to view details →</p>
                    </div>
                `).join("");

            } catch (error) {
                resultsDiv.innerHTML = '<div class="error">Error searching recipes</div>';
            }
        }

        async function viewRecipe(mealId, mealName) {
            try {
                const response = await fetch(`${THEMEALDB_URL}/lookup.php?i=${mealId}`);
                const data = await response.json();
                const recipe = data.meals[0];

                const pantry = getPantry();
                const ingredients = extractIngredients(recipe);
                const missing = ingredients.filter(i => !pantry.includes(i.toLowerCase()));

                // Populate modal
                document.getElementById("modalRecipeName").textContent = recipe.strMeal;
                document.getElementById("modalIngredients").textContent = ingredients.join(", ");
                document.getElementById("modalInstructions").textContent = recipe.strInstructions;

                if (missing.length > 0) {
                    document.getElementById("modalMissingStatus").innerHTML = `<span class="missing">Missing: ${missing.join(", ")}</span>`;
                } else {
                    document.getElementById("modalMissingStatus").innerHTML = `<span class="have">✅ You have all ingredients!</span>`;
                }

                currentRecipeId = mealId;
                currentRecipeName = mealName;

                // Show modal
                document.getElementById("recipeModal").style.display = "block";
            } catch (error) {
                showMessage("searchMessage", "Error loading recipe", "error");
            }
        }

        function extractIngredients(recipe) {
            const ingredients = [];
            for (let i = 1; i <= 20; i++) {
                const ingredient = recipe[`strIngredient${i}`];
                if (ingredient && ingredient.trim()) {
                    ingredients.push(ingredient.trim());
                }
            }
            return ingredients;
        }

        function saveFromModal() {
            if (currentRecipeId && currentRecipeName) {
                const favorites = getFavorites();
                if (favorites.find(f => f.id === currentRecipeId)) {
                    showMessage("searchMessage", "Already saved", "error");
                    return;
                }

                favorites.push({ id: currentRecipeId, name: currentRecipeName });
                saveFavorites(favorites);
                showMessage("searchMessage", `✅ Saved '${currentRecipeName}'`, "success");
                closeModal();
            }
        }

        function closeModal() {
            document.getElementById("recipeModal").style.display = "none";
        }

        window.onclick = function (event) {
            const modal = document.getElementById("recipeModal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        function renderFavorites() {
            const favorites = getFavorites();
            const list = document.getElementById("favoritesList");

            if (favorites.length === 0) {
                list.innerHTML = '<div class="empty-state">No saved recipes yet</div>';
                return;
            }

            list.innerHTML = favorites.map(fav => `
                <div class="recipe-card">
                    <h3>${fav.name}</h3>
                    <div class="recipe-buttons">
                        <button onclick="viewRecipe('${fav.id}', '${fav.name.replace(/'/g, "\\'")}')">Details</button>
                        <button class="secondary" onclick="removeFavorite('${fav.id}')">Remove</button>
                    </div>
                </div>
            `).join("");
        }

        function removeFavorite(mealId) {
            const favorites = getFavorites();
            const updated = favorites.filter(f => f.id !== mealId);
            saveFavorites(updated);
        }

        // Grocery list
        async function buildGroceryList() {
            const favorites = getFavorites();
            if (favorites.length === 0) {
                const listDiv = document.getElementById("groceryList");
                listDiv.innerHTML = '<div class="error">No saved recipes to build from</div>';
                return;
            }

            const pantry = getPantry();
            const allMissing = new Set();

            const listDiv = document.getElementById("groceryList");
            listDiv.innerHTML = '<div class="loading">Building list...</div>';

            try {
                for (const fav of favorites) {
                    const response = await fetch(`${THEMEALDB_URL}/lookup.php?i=${fav.id}`);
                    const data = await response.json();
                    const recipe = data.meals[0];
                    const ingredients = extractIngredients(recipe);
                    ingredients.forEach(ing => {
                        if (!pantry.includes(ing.toLowerCase())) {
                            allMissing.add(ing);
                        }
                    });
                }

                if (allMissing.size === 0) {
                    listDiv.innerHTML = '<div class="empty-state"><span class="have">✅ You have all ingredients for your saved recipes!</span></div>';
                } else {
                    listDiv.innerHTML = `
                        <div class="grocery-list">
                            <ul>${Array.from(allMissing).sort().map(item => `<li>${item}</li>`).join("")}</ul>
                        </div>
                    `;
                }
            } catch (error) {
                listDiv.innerHTML = '<div class="error">Error building grocery list</div>';
            }
        }

        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            const className = type === "error" ? "error" : "success";
            element.innerHTML = `<div class="${className}">${message}</div>`;
            setTimeout(() => element.innerHTML = "", 3000);
        }

        // Initialize
        renderPantry();
        renderFavorites();
    </script>
</body>

</html>
